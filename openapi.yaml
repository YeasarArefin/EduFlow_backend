openapi: 3.0.3
info:
  title: EduFlow API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/permission-management:
    get:
      summary: Get workspace role permission configuration
      operationId: getWorkspacePermissionConfiguration
      description: Workspace Owner only. Returns existing permission codes grouped by module with effective workspace role grants.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses: { "200": { description: Permission configuration }, "403": { description: WORKSPACE_OWNER_REQUIRED } }
  /api/v1/permission-management/roles:
    post:
      summary: Create a workspace-owned role
      operationId: createWorkspaceRole
      description: Workspace Owner only. Creates a role with a workspace-local name and selected existing permissions.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses: { "201": { description: Workspace role created }, "400": { $ref: "#/components/responses/ValidationError" }, "403": { description: WORKSPACE_OWNER_REQUIRED } }
  /api/v1/permission-management/roles/{roleId}:
    patch:
      summary: Update a workspace-owned role and its permissions
      operationId: updateWorkspaceRolePermissions
      description: Workspace Owner only. Owner remains protected and is not represented by an editable role record.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: object, required: [permissionCode, allowed], properties: { permissionCode: { type: integer }, allowed: { type: boolean } } } } } } } } }
      responses: { "200": { description: Updated configuration }, "400": { $ref: "#/components/responses/ValidationError" }, "403": { description: WORKSPACE_OWNER_REQUIRED } }
    delete:
      summary: Delete an unused workspace-owned role
      operationId: deleteWorkspaceRole
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Role deleted }, "409": { description: ROLE_IN_USE } }
  /api/v1/permission-management/members/{memberId}:
    get:
      summary: Get member permission overrides
      operationId: getMemberPermissionOverrides
      description: Workspace Owner only. Returns inherited role access and any member-specific allow or deny override.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Member permission matrix }, "403": { description: WORKSPACE_OWNER_REQUIRED }, "409": { description: OWNER_MEMBER_PROTECTED } }
    patch:
      summary: Replace member permission overrides
      operationId: updateMemberPermissionOverrides
      description: Workspace Owner only. Sends the complete set of explicit member allow or deny overrides; omitted permissions inherit the current role default.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [overrides], properties: { overrides: { type: array, items: { type: object, required: [permissionCode, allowed], properties: { permissionCode: { type: integer }, allowed: { type: boolean } } } } } } } } }
      responses: { "200": { description: Updated member permission matrix }, "400": { $ref: "#/components/responses/ValidationError" }, "403": { description: WORKSPACE_OWNER_REQUIRED }, "409": { description: OWNER_MEMBER_PROTECTED } }
    delete:
      summary: Reset member permissions to role defaults
      operationId: resetMemberPermissionOverrides
      description: Workspace Owner only. Removes all explicit member overrides without changing role permissions.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Member now inherits role defaults }, "403": { description: WORKSPACE_OWNER_REQUIRED }, "409": { description: OWNER_MEMBER_PROTECTED } }
  /api/v1/members:
    get:
      summary: List workspace members
      operationId: listWorkspaceMembers
      description: Requires members.manage. Lists only memberships in the server-resolved workspace with name, email, role, lifecycle status, and joined date.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: roleId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, removed] } }
      responses:
        "200": { description: Paginated workspace members }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace subscription access and members.manage required }
    post:
      summary: Create an EduFlow account and workspace membership
      operationId: addWorkspaceMember
      description: Requires members.manage. Creates the email/password account and assigns a role owned by the current workspace. Owner is never assignable through this endpoint.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, roleId]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                roleId: { type: string, format: uuid }
      responses:
        "201": { description: Workspace member added }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: ROLE_NOT_FOUND }
        "409": { description: Existing email or duplicate membership }
  /api/v1/members/{id}/role:
    patch:
      summary: Change a workspace member role
      operationId: updateWorkspaceMemberRole
      description: Requires members.manage. The current workspace owner cannot be changed.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roleId], properties: { roleId: { type: string, format: uuid } } } } } }
      responses:
        "200": { description: Updated workspace member }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: MEMBER_NOT_FOUND }
        "409": { description: OWNER_MEMBER_PROTECTED }
  /api/v1/members/{id}/status:
    patch:
      summary: Suspend or reactivate a workspace member
      operationId: updateWorkspaceMemberStatus
      description: Requires members.manage. The current workspace owner cannot be suspended.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, suspended] } } } } } }
      responses:
        "200": { description: Updated workspace member }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: MEMBER_NOT_FOUND }
        "409": { description: OWNER_MEMBER_PROTECTED }
  /api/v1/members/{id}:
    delete:
      summary: Archive a workspace member
      operationId: removeWorkspaceMember
      description: Requires members.manage. Archives the membership as removed; it does not delete the user account. The current workspace owner cannot be removed.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Archived workspace member }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: MEMBER_NOT_FOUND }
        "409": { description: OWNER_MEMBER_PROTECTED }
  /api/v1/workspace-settings:
    get:
      summary: Get workspace settings
      operationId: getWorkspaceSettings
      description: Workspace Owner only. Returns coaching profile, billing, SMS, and reminder settings for the server-resolved workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200": { description: Current workspace settings }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Active workspace subscription and Workspace Owner role required }
    patch:
      summary: Update workspace settings
      operationId: updateWorkspaceSettings
      description: Workspace Owner only. Updates only supplied coaching profile, billing, SMS, or reminder fields and records an audit event.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                phone: { type: string, nullable: true, maxLength: 30 }
                email: { type: string, nullable: true, format: email, maxLength: 255 }
                address: { type: string, nullable: true, maxLength: 1000 }
                defaultFeeDueDay: { type: integer, nullable: true, minimum: 1, maximum: 31 }
                gracePeriodDays: { type: integer, minimum: 0, maximum: 365 }
                receiptPrefix: { type: string, nullable: true, maxLength: 20 }
                smsDefaultSenderId: { type: string, nullable: true, maxLength: 100 }
                absenceEmailEnabled: { type: boolean }
                absenceEmailRecipient: { type: string, enum: [guardian, student, both] }
                paymentConfirmationEnabled: { type: boolean }
                paymentReminderEnabled: { type: boolean }
                graceReminderEnabled: { type: boolean }
                overdueWarningEnabled: { type: boolean }
      responses:
        "200": { description: Updated workspace settings }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Active workspace subscription and Workspace Owner role required }
  /api/v1/teacher-salaries:
    get:
      summary: List workspace teacher salary snapshots
      operationId: listTeacherSalaries
      description: Requires fees.view. Lists only the server-resolved workspace; filter by salaryMonth and derived status. Monetary values are exact NUMERIC(19,2) strings.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: salaryMonth, in: query, schema: { type: string, format: date, pattern: '^[1-9]\\d{3}-\\d{2}-01$' } }
        - { name: status, in: query, schema: { type: string, enum: [pending, partially_paid, paid, overdue, waived] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { "200": { description: Paginated salary snapshots }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { description: Workspace subscription access and fees.view required } }
  /api/v1/teacher-salaries/generate:
    post:
      summary: Bulk generate active teacher salary snapshots
      operationId: bulkGenerateTeacherSalaries
      description: Requires fees.generate. Active teachers are inserted idempotently; later teacher salary changes cannot rewrite existing monthly rows.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [salaryMonth], properties: { salaryMonth: { type: string, format: date, pattern: '^[1-9]\\d{3}-\\d{2}-01$' } } } } }
      responses: { "200": { description: Generation counts }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { description: Workspace subscription access and fees.generate required } }
  /api/v1/teacher-salaries/teachers/{teacherId}/generate:
    post:
      summary: Generate one teacher salary snapshot
      operationId: generateTeacherSalary
      description: Requires fees.generate. Returns 201 for a newly generated active teacher row and 200 for an idempotent retry.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [salaryMonth], properties: { salaryMonth: { type: string, format: date, pattern: '^[1-9]\\d{3}-\\d{2}-01$' } } } } }
      responses: { "200": { description: Existing salary snapshot }, "201": { description: New salary snapshot }, "404": { description: TEACHER_NOT_FOUND }, "409": { description: TEACHER_NOT_SALARY_ELIGIBLE } }
  /api/v1/teacher-salaries/teachers/{teacherId}:
    get:
      summary: Get a teacher salary history
      operationId: getTeacherSalaryHistory
      description: Requires fees.view and returns only the requested teacher in the current workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Paginated teacher salary history }, "404": { description: TEACHER_NOT_FOUND } }
  /api/v1/teacher-salaries/{id}/payments:
    get:
      summary: List payments for a teacher salary ledger
      operationId: listTeacherSalaryPayments
      description: Requires fees.view. Returns immutable payments only for the requested salary ledger in the server-resolved workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Teacher salary payment history }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace subscription access and fees.view required }
        "404": { description: TEACHER_SALARY_NOT_FOUND }
    post:
      summary: Record a teacher salary payment
      operationId: recordTeacherSalaryPayment
      description: Requires fees.collect. Atomically records an immutable payout and updates the salary balance. Payments above the remaining balance are rejected.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, paymentMethod]
              properties:
                amount: { oneOf: [{ type: string, pattern: '^\d+(\.\d{1,2})?$' }, { type: number, exclusiveMinimum: 0 }] }
                paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
                paymentDate: { type: string, format: date }
                note: { type: string, maxLength: 500 }
      responses:
        "201": { description: Recorded payment and updated salary balance }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace subscription access and fees.collect required }
        "404": { description: TEACHER_SALARY_NOT_FOUND }
        "409": { description: TEACHER_SALARY_ALREADY_SETTLED or EXCESS_SALARY_PAYMENT_NOT_ALLOWED }
  /api/v1/attendance-sessions:
    get:
      summary: List attendance sessions
      operationId: listAttendanceSessions
      description: >-
        Requires an authenticated workspace member, active subscription access, and attendance.view (1301).
        Lists only sessions in the server-resolved workspace, ordered by session date and creation time descending.
        Optional batch, date, and status filters are workspace-scoped. Each item includes its fixed roster count
        and current present/absent totals. Archived enrollments do not remove historical session records.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: sessionDate, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AttendanceSessionStatus" } }
        - { $ref: "#/components/parameters/AttendancePage" }
        - { $ref: "#/components/parameters/AttendanceLimit" }
      responses:
        "200": { description: Paginated workspace attendance sessions, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceSessionListResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or attendance.view permission required }
    post:
      summary: Create a draft attendance session and snapshot its roster
      operationId: createAttendanceSession
      description: >-
        Requires attendance.mark (1302). The server verifies the active workspace batch, inserts one draft
        session, then snapshots every active student with an active enrollment whose date range covers
        sessionDate. Each generated record defaults to absent. A batch/date may have one session only.
        Later enrollment or student changes never rewrite the snapshot. An empty eligible roster is valid.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAttendanceSession" } } }
      responses:
        "201": { description: Draft session and roster created, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceSessionResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or attendance.mark permission required }
        "404": { description: BATCH_NOT_FOUND, including another workspace's batch ID }
        "409": { description: BATCH_NOT_ACTIVE or ATTENDANCE_SESSION_ALREADY_EXISTS }
  /api/v1/attendance-sessions/{id}:
    get:
      summary: Get an attendance session and its roster
      operationId: getAttendanceSession
      description: Requires attendance.view (1301). Returns the immutable roster snapshot and each present/absent status.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/AttendanceSessionId" }
      responses:
        "200": { description: Attendance session with records, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceSessionResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or attendance.view permission required }
        "404": { description: ATTENDANCE_SESSION_NOT_FOUND, including another workspace's ID }
  /api/v1/attendance-sessions/{id}/records:
    patch:
      summary: Bulk save attendance statuses for a draft session
      operationId: saveAttendanceRecords
      description: >-
        Requires attendance.update (1303). Updates one to 500 unique records in one transaction. Every student
        must already be in this session's snapshot roster; the API cannot add students or accept a workspace ID.
        Omitted roster records retain their current status. Finalized sessions return 409 and are never reopened
        by this phase.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/AttendanceSessionId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulkSaveAttendance" } } }
      responses:
        "200": { description: Updated draft session and complete roster, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceSessionResponse" } } } }
        "400": { description: ValidationError or ATTENDANCE_ROSTER_MISMATCH }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or attendance.update permission required }
        "404": { description: ATTENDANCE_SESSION_NOT_FOUND }
        "409": { description: ATTENDANCE_SESSION_FINALIZED }
  /api/v1/attendance-sessions/{id}/finalize:
    post:
      summary: Finalize an attendance session
      operationId: finalizeAttendanceSession
      description: >-
        Requires attendance.finalize (1304). Finalization is transactional and audited. It locks the session's
        roster and statuses against all later updates. Reopening is intentionally outside this phase.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/AttendanceSessionId" }
      responses:
        "200": { description: Finalized session and roster, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceSessionResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or attendance.finalize permission required }
        "404": { description: ATTENDANCE_SESSION_NOT_FOUND }
        "409": { description: ATTENDANCE_SESSION_FINALIZED }
  /api/v1/student-fees/enrollments/{enrollmentId}/generate:
    post:
      summary: Generate one enrollment's monthly fee snapshot
      operationId: generateEnrollmentFee
      description: >-
        Requires an authenticated active workspace member, subscription access, and fees.generate (1402).
        Workspace ownership is resolved by the server after validating X-Workspace-Id membership.
        Generates a full monthly charge for an eligible active enrollment, student, and batch; no proration.
        The month must overlap enrollment and batch start/end dates and be at or after feeStartMonth when set.
        Snapshots the enrollment override (including zero), otherwise the batch fee, then caps the enrollment
        discount at that charge. Legacy poisha sources are converted exactly to decimal BDT taka in PostgreSQL.
        Existing enrollment/month rows return unchanged even after archival or configuration changes; only the
        date-sensitive response status is derived at read time. Concurrent retries are safe. Newly inserted
        records and the fees.generated audit entry commit atomically. No payment or receipt is created.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateStudentFee" }
      responses:
        "201":
          description: New monthly fee snapshot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentFeeResponse" }
        "200":
          description: Existing monthly fee snapshot returned; no financial or date fields rewritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentFeeResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.generate permission required }
        "404": { description: ENROLLMENT_NOT_FOUND; includes enrollment IDs outside the current workspace }
        "409": { description: ENROLLMENT_NOT_FEE_ELIGIBLE or FEE_SETTINGS_INVALID (due day must be 1–31 and grace days 0–365) }
        "429": { description: FEE_GENERATION_RATE_LIMITED; maximum 60 generation requests per workspace per minute, shared with bulk generation. Global IP limits also apply. }
  /api/v1/student-fees/generate:
    post:
      summary: Bulk generate eligible active enrollment fees for a month
      operationId: bulkGenerateStudentFees
      description: >-
        Requires subscription access and fees.generate (1402). Uses the same eligibility, snapshot,
        decimal BDT, date, and discount rules as single generation. All eligible rows are generated in
        one transaction with one audit entry when any rows are created. Existing rows are never overwritten.
        Counts describe currently eligible enrollments; old fees for now-inactive enrollments remain in
        history but are excluded from these counts. An empty eligible set is a successful no-op.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateStudentFee" }
      responses:
        "200":
          description: Generation counts, including idempotent retries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [feeMonth, eligible, created, existing]
                    properties:
                      feeMonth: { $ref: "#/components/schemas/FeeMonth" }
                      eligible: { type: integer, minimum: 0 }
                      created: { type: integer, minimum: 0 }
                      existing: { type: integer, minimum: 0, description: Eligible rows already generated, including concurrent inserts }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.generate permission required }
        "409": { description: FEE_SETTINGS_INVALID; no rows generated }
        "429": { description: FEE_GENERATION_RATE_LIMITED; shares the 60 requests per workspace per minute generation limit. Global IP limits also apply. }
  /api/v1/student-fees:
    get:
      summary: List workspace fees by month and optional status
      operationId: listWorkspaceStudentFees
      description: >-
        Requires subscription access and fees.view (1401). Returns only current-workspace snapshots,
        including history for archived students/enrollments/batches. Status filtering uses the same
        Bangladesh-date calculation as the response, so overdue rows do not depend on a scheduled job.
        Ordered by feeMonth descending then id descending. Unknown query fields are rejected.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: feeMonth, in: query, required: true, schema: { $ref: "#/components/schemas/FeeMonth" } }
        - { $ref: "#/components/parameters/FeeStatusFilter" }
        - { $ref: "#/components/parameters/FeePage" }
        - { $ref: "#/components/parameters/FeeLimit" }
      responses:
        "200":
          description: Paginated fee snapshots and matching total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentFeeListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
  /api/v1/students/{id}/fees:
    get:
      summary: Get a student's monthly fee history across enrollments
      operationId: getStudentFeeHistory
      description: >-
        Requires subscription access and fees.view (1401), independently of students.view.
        Uses the same ordering, effective status, decimal string amounts, and pagination as the workspace
        fee list. Month is optional. Archived history remains visible; a student without fees has an empty list.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { name: feeMonth, in: query, schema: { $ref: "#/components/schemas/FeeMonth" } }
        - { $ref: "#/components/parameters/FeeStatusFilter" }
        - { $ref: "#/components/parameters/FeePage" }
        - { $ref: "#/components/parameters/FeeLimit" }
      responses:
        "200":
          description: Paginated historical snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentFeeListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
        "404": { description: STUDENT_NOT_FOUND; includes student IDs outside the current workspace }
  /api/v1/student-fees/{id}/payments:
    post:
      summary: Record a payment against a student fee
      operationId: recordStudentFeePayment
      description: >-
        Requires subscription access and fees.collect (1403). Transactionally records a partial or full
        payment against a student fee, auto-generates a workspace-scoped sequential receipt number
        (or validates an optional caller-supplied receipt number), recalculates paid/due amounts, and updates
        the fee status. Excess payments above the outstanding due balance are rejected with 409.
        Historical payments are immutable.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStudentPayment" }
      responses:
        "201":
          description: Payment successfully recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordStudentPaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.collect permission required }
        "404": { description: FEE_NOT_FOUND or STUDENT_NOT_FOUND }
        "409": { description: EXCESS_PAYMENT_NOT_ALLOWED, FEE_ALREADY_PAID, FEE_ALREADY_WAIVED, or DUPLICATE_RECEIPT_NUMBER }
    get:
      summary: List all payments recorded for a fee
      operationId: listStudentFeePayments
      description: >-
        Requires subscription access and fees.view (1401). Returns all payment receipts recorded against
        the specified student fee in reverse chronological order.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of payments for this fee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPaymentListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
        "404": { description: FEE_NOT_FOUND }
  /api/v1/students/{id}/payments:
    get:
      summary: List payment history for a student
      operationId: listStudentPaymentHistory
      description: >-
        Requires subscription access and fees.view (1401). Returns paginated payment records and receipt numbers
        for the student across all fees, with optional date and method filters.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: paymentMethod, in: query, schema: { type: string, enum: [cash, bkash, nagad, rocket, other] } }
      responses:
        "200":
          description: Paginated student payment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPaymentHistoryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
        "404": { description: STUDENT_NOT_FOUND }
  /api/v1/student-payments/{id}:
    get:
      summary: Get payment and receipt detail by ID
      operationId: getStudentPaymentDetail
      description: >-
        Requires subscription access and fees.view (1401). Returns the payment record, fee context, and student metadata.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Payment detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPaymentDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
        "404": { description: PAYMENT_NOT_FOUND }
  /api/v1/student-payments/receipts/{receiptNumber}:
    get:
      summary: Get payment and receipt detail by receipt number
      operationId: getStudentPaymentByReceiptNumber
      description: >-
        Requires subscription access and fees.view (1401). Looks up a receipt by its unique workspace receipt number.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: receiptNumber, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Receipt and payment detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPaymentDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Workspace membership, subscription access, or fees.view permission required }
        "404": { description: RECEIPT_NOT_FOUND }

  /api/v1/activity:
    get:
      summary: List platform business activity
      operationId: listPlatformActivity
      description: Returns a paginated, privacy-safe summary of auditable payment, plan, entitlement, and lifecycle actions. Sensitive request payloads and credentials are never included.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [payment, plan, entitlement, lifecycle] } }
      responses:
        "200": { description: Paginated platform activity with safe metadata summaries }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/account/state:
    get:
      summary: Get the authenticated account's SaaS routing state
      operationId: getAccountState
      description: Database-derived routing state. A workspace membership takes precedence over an approved unused purchase; pending purchases route to payment review.
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Current account routing state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [route]
                    properties:
                      route: { type: string, enum: [dashboard, workspace_creation, payment_pending, account] }
                      workspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/workspaces/onboarding-state:
    get:
      summary: Get the current workspace onboarding state
      operationId: getWorkspaceOnboardingState
      description: Returns routing state derived from existing workspace, subscription-access, and payment-request records.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/WorkspaceOnboardingState" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/workspaces/onboard:
    post:
      summary: Create the workspace for an approved account purchase
      operationId: createWorkspaceOnboard
      description: Consumes the authenticated user's approved unused subscription purchase atomically, then creates the active workspace, Owner membership, default settings, and attached subscription. A user who already belongs to a workspace cannot create another one.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceOnboard" }
      responses:
        "201":
          description: Active workspace created from the approved purchase
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/OnboardedWorkspace" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Workspace already exists, slug already exists, or creation is not unlocked by an approved purchase }
  /api/v1/workspaces/dashboard-summary:
    get:
      summary: Get the current workspace dashboard summary
      operationId: getWorkspaceDashboardSummary
      description: Returns the authenticated member's own workspace identity, access state, current plan dates, effective feature entitlements, membership count, and latest subscription-payment status. The workspace is resolved only from the verified X-Workspace-Id membership context.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current workspace dashboard information
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/WorkspaceDashboardSummary" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
        "404": { description: Workspace not found }
  /api/v1/workspaces/{workspaceId}/subscription-operations/{operation}:
  /api/v1/teachers:
    get:
      summary: List workspace teachers
      operationId: listTeachers
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses: { "200": { description: Paginated teachers }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" } }
    post:
      summary: Create a workspace teacher
      operationId: createTeacher
      security: [{ betterAuth: [] }]
      responses: { "201": { description: Teacher created }, "400": { $ref: "#/components/responses/ValidationError" }, "409": { description: Teacher code already exists in this workspace } }
  /api/v1/teachers/{id}:
    get: { summary: Get workspace teacher, operationId: getTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher }, "404": { description: Teacher not found } } }
    patch: { summary: Update or reactivate workspace teacher, operationId: updateTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher updated }, "409": { description: Teacher code already exists in this workspace } } }
    delete: { summary: Archive workspace teacher, operationId: archiveTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher archived } } }
  /api/v1/batches:
    get:
      summary: List workspace batches
      operationId: listBatches
      description: Returns a paginated, search-filtered list scoped to the verified workspace context. Requires active subscription access and batches.view permission.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, archived] } }
      responses:
        "200": { $ref: "#/components/responses/BatchList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BatchAccessRequired" }
    post:
      summary: Create a workspace batch profile
      operationId: createBatch
      description: Creates a batch with workspace-owned academic references and weekday class days (Sunday=0 through Saturday=6). The optional start date is a calendar date. Teacher and student assignments are intentionally excluded.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBatch" } } } }
      responses:
        "201": { $ref: "#/components/responses/BatchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BatchAccessRequired" }
        "409": { description: A batch with this name already exists in this workspace }
  /api/v1/batches/{id}:
    get:
      summary: Get workspace batch detail
      operationId: getBatch
      description: Returns the batch profile and its academic labels, all scoped to the verified workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    patch:
      summary: Update or reactivate a workspace batch profile
      operationId: updateBatch
      description: Updates batch profile values, including its weekday class-day schedule. Teacher and student assignments are intentionally excluded.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace }, "409": { description: A batch with this name already exists in this workspace } }
    delete:
      summary: Archive a workspace batch
      operationId: archiveBatch
      description: Soft-archives the batch by setting its status to archived; no batch profile data is hard-deleted.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
  /api/v1/batches/{id}/teachers:
    get:
      summary: List teachers assigned to a batch
      operationId: listBatchTeachers
      description: Returns teachers assigned to the verified workspace batch, with the optional primary-teacher flag.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    post:
      summary: Assign a teacher to a batch
      operationId: assignBatchTeacher
      description: Assigns one workspace-owned teacher. A teacher can be assigned once per batch; setting isPrimary replaces any existing primary teacher.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssignBatchTeacher" } } } }
      responses: { "201": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch or teacher not found in this workspace }, "409": { description: Teacher is already assigned to this batch } }
  /api/v1/batches/{id}/teachers/{teacherId}:
    patch:
      summary: Set or clear a batch primary teacher
      operationId: updateBatchTeacher
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBatchTeacher" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch teacher assignment not found } }
    delete:
      summary: Remove a teacher from a batch
      operationId: removeBatchTeacher
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch teacher assignment not found } }
  /api/v1/batches/{id}/students:
    get:
      summary: List students enrolled in a batch
      operationId: listBatchStudents
      description: Returns students enrolled in the verified workspace batch with customized fee information and status.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    post:
      summary: Enroll a student into a batch
      operationId: enrollBatchStudent
      description: Enrolls an active workspace student into the batch with optional fee overrides or discounts.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollStudent" } } } }
      responses: { "201": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch or student not found in this workspace }, "409": { description: Student is already actively enrolled in this batch } }
  /api/v1/batches/{id}/students/{enrollmentId}:
    patch:
      summary: Update or archive/reactivate student enrollment
      operationId: updateBatchEnrollment
      description: Updates student fee configuration, joined date, or status (active, inactive, archived).
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEnrollment" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Student enrollment not found in this batch } }
    delete:
      summary: Archive a student's batch enrollment
      operationId: archiveBatchEnrollment
      description: Archives the enrollment without deleting it, preserving enrollment history.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Student enrollment not found in this batch } }
  /api/v1/students:
    get:
      summary: List workspace students
      operationId: listStudents
      description: Returns a paginated, search-filtered list scoped to the verified workspace context. Requires active subscription access and students.view permission.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, archived] } }
      responses:
        "200": { $ref: "#/components/responses/StudentList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StudentAccessRequired" }
    post:
      summary: Create a workspace student
      operationId: createStudent
      description: Creates a student in the verified workspace context. studentCode is unique only within that workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateStudent" } } } }
      responses:
        "201": { $ref: "#/components/responses/StudentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StudentAccessRequired" }
        "409": { description: A student code already exists in this workspace }
  /api/v1/students/{id}:
    get:
      summary: Get a workspace student
      operationId: getStudent
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
  /api/v1/students/{id}/enrollments:
    get:
      summary: List a student's batch enrollment history
      operationId: listStudentEnrollments
      description: Returns current and historical batch memberships for a student in the verified workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
    patch:
      summary: Update a workspace student
      operationId: updateStudent
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStudent" } } } }
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace }, "409": { description: A student code already exists in this workspace } }
    delete:
      summary: Archive a workspace student
      operationId: archiveStudent
      description: Soft-archives the student by setting status to archived; no student record is hard-deleted.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
  /api/v1/workspaces/{workspaceId}/subscription-operations/{operation}:
    post:
      summary: Run a Platform Owner subscription lifecycle operation
      operationId: runPlatformSubscriptionOperation
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
        - {
            name: operation,
            in: path,
            required: true,
            schema: { type: string, enum: [lock, unlock, renewal-due, expire, schedule-deletion] }
          }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                properties: { scheduledDeleteAt: { type: string, format: date-time } }
              }
      responses:
        "200": { description: Lifecycle operation applied or already satisfied }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace or subscription not found }
        "409": { description: Invalid lifecycle transition }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides:
    get:
      summary: List workspace entitlement overrides
      operationId: listWorkspaceEntitlementOverrides
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      responses:
        {
          "200":
            {
              description: Overrides,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          properties:
                            { data: { type: array, items: { $ref: "#/components/schemas/EntitlementOverride" } } }
                        }
                    }
                }
            },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found }
        }
    post:
      summary: Create a workspace entitlement override
      operationId: createWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverrideInput" } } }
        }
      responses:
        {
          "201": { description: Override created },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found },
          "409": { description: Override already exists }
        }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides/{id}:
    patch:
      summary: Update a workspace entitlement override
      operationId: updateWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverridePatch" } } }
        }
      responses:
        {
          "200": { description: Override updated },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
    delete:
      summary: Remove a workspace entitlement override
      operationId: removeWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      responses:
        {
          "204": { description: Override removed },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
  /api/v1/plans:
    get:
      summary: List plans
      operationId: listPlans
      security: [{ betterAuth: [] }]
      responses:
        "200":
          {
            description: Plans,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } }
                      }
                  }
              }
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
    post:
      summary: Create a plan
      operationId: createPlan
      security: [{ betterAuth: [] }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "201": { description: Plan created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { description: Plan slug already exists }
  /api/v1/public/plans:
    get:
      summary: List active purchasable plans
      operationId: listPublicPlans
      description: Returns only active plans and their public feature defaults. Monetary and quota values are exact minor-unit strings.
      responses:
        "200":
          description: Active public plans
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicPlan" } }
  /api/v1/plans/{id}:
    patch:
      summary: Update a plan
      operationId: updatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "200": { description: Plan updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Plan not found }
        "409": { description: Plan slug already exists }
  /api/v1/plans/features:
    get:
      summary: List the Platform feature catalog for plan configuration
      operationId: listPlatformFeatures
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Feature catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/plans/{id}/activate:
    post:
      summary: Activate a plan
      operationId: activatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan activated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/plans/{id}/deactivate:
    post:
      summary: Deactivate a plan without deleting history
      operationId: deactivatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan deactivated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/workspaces/{id}:
    get:
      summary: Get a Platform Owner workspace detail
      operationId: getPlatformWorkspaceDetail
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
      responses:
        "200":
          {
            description: Workspace detail,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { $ref: "#/components/schemas/WorkspaceDetail" } }
                      }
                  }
              }
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace not found }
  /api/v1/workspaces:
    get:
      summary: List workspaces for the Platform Owner
      operationId: listPlatformWorkspaces
      security:
        - betterAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 150 } }
        - {
            name: workspaceStatus,
            in: query,
            schema: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
          }
        - {
            name: subscriptionStatus,
            in: query,
            schema: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
          }
        - {
            name: accessStatus,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    verification_pending,
                    payment_pending,
                    trial,
                    active,
                    renewal_due,
                    subscription_expired,
                    locked,
                    scheduled_for_deletion,
                    suspended
                  ]
              }
          }
        - {
            name: lifecycleQueue,
            in: query,
            description: Restrict the list to locked and scheduled-for-deletion workspaces for the Platform Owner deletion queue.
            schema: { type: boolean }
          }
      responses:
        "200":
          description: Paginated workspace listing with raw workspace, subscription, and effective access summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests:
    post:
      summary: Submit a manual subscription payment
      operationId: createPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Pending payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account:
    post:
      summary: Submit a manual subscription payment for the authenticated account
      operationId: createAccountPaymentRequest
      description: Creates an account-level pending purchase without creating a workspace. Platform Owner approval unlocks one workspace creation.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Pending account payment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account/latest:
    get:
      summary: Get the authenticated account's latest subscription payment
      operationId: getLatestAccountPaymentRequest
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Latest account-level payment request, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf: [{ $ref: "#/components/schemas/PaymentRequest" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/payment-requests/pending:
    get:
      summary: List pending payment requests
      operationId: listPendingPaymentRequests
      security:
        - betterAuth: []
      responses:
        "200":
          description: Pending payment requests
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PendingPaymentRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/revenue-overview:
    get:
      summary: Get Platform Owner payment and revenue aggregates
      operationId: getRevenueOverview
      description: Aggregates payment records in PostgreSQL and returns exact minor-unit amounts as decimal strings.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Exact payment aggregates, approved revenue by plan, and recent payment activity }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/latest:
    get:
      summary: Get the latest subscription payment for the selected workspace
      operationId: getLatestPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Latest subscription payment request, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaymentRequest"
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/payment-requests/{id}/approve:
    post:
      summary: Approve a pending payment request
      operationId: approvePaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      description: Account-level payments unlock one workspace creation. Workspace renewal payments transactionally create or renew the workspace subscription. Previous current subscriptions are retained as historical rows.
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
  /api/v1/payment-requests/{id}/reject:
    post:
      summary: Reject a pending payment request
      operationId: rejectPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              additionalProperties: false
              properties:
                rejectionReason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
components:
  securitySchemes:
    betterAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    AttendanceSessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttendancePage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    AttendanceLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FeeStatusFilter:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/StudentFeeStatus" }
    FeePage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    FeeLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    WorkspacePathId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverrideId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspacePathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    PaymentRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AttendanceSessionStatus:
      type: string
      enum: [draft, finalized]
    AttendanceRecordStatus:
      type: string
      enum: [present, absent]
    CreateAttendanceSession:
      type: object
      additionalProperties: false
      required: [batchId, sessionDate]
      properties:
        batchId: { type: string, format: uuid }
        sessionDate: { type: string, format: date }
    BulkSaveAttendance:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [studentId, status]
            properties:
              studentId: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/AttendanceRecordStatus" }
    AttendanceRecord:
      type: object
      required: [id, studentId, status, student, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AttendanceRecordStatus" }
        student:
          type: object
          required: [id, studentCode, fullName]
          properties:
            id: { type: string, format: uuid }
            studentCode: { type: string }
            fullName: { type: string }
            phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttendanceSession:
      type: object
      required: [id, batchId, sessionDate, status, batch, records, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        sessionDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/AttendanceSessionStatus" }
        batch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        records:
          type: array
          items: { $ref: "#/components/schemas/AttendanceRecord" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttendanceSessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AttendanceSession" }
    AttendanceSessionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, batchId, sessionDate, status, batch, rosterCount, presentCount, absentCount, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid }
              batchId: { type: string, format: uuid }
              sessionDate: { type: string, format: date }
              status: { $ref: "#/components/schemas/AttendanceSessionStatus" }
              batch:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              rosterCount: { type: integer, minimum: 0 }
              presentCount: { type: integer, minimum: 0 }
              absentCount: { type: integer, minimum: 0 }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    FeeMonth:
      type: string
      format: date
      pattern: '^[1-9]\d{3}-\d{2}-01$'
      example: '2026-09-01'
      description: Calendar month represented by its first day, from 1000-01-01 through 9998-12-01. Date-only; not a timestamp.
    GenerateStudentFee:
      type: object
      additionalProperties: false
      required: [feeMonth]
      properties:
        feeMonth: { $ref: "#/components/schemas/FeeMonth" }
    BdtFeeAmount:
      type: string
      pattern: '^\d{1,17}\.\d{2}$'
      example: '1250.50'
      description: Exact nonnegative BDT taka, backed by NUMERIC(19,2). Always a fixed two-decimal string; never a JS number or poisha value.
    StudentFeeStatus:
      type: string
      enum: [unpaid, partially_paid, paid, overpaid, waived, overdue]
      description: >-
        Net charge is expectedAmount minus discountAmount. Priority is overpaid (paid exceeds net),
        waived (zero net and zero paid), paid (positive net fully paid), overdue (positive due after graceDate
        in Asia/Dhaka), partially_paid (positive paid and due within grace), then unpaid.
        GraceDate itself is inclusive. Status is derived on reads; stored status is the generation/write-time state.
    StudentFee:
      type: object
      required: [id, studentId, enrollmentId, feeMonth, expectedAmount, discountAmount, paidAmount, dueAmount, status, dueDate, graceDate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        enrollmentId: { type: string, format: uuid }
        feeMonth: { $ref: "#/components/schemas/FeeMonth" }
        expectedAmount:
          allOf: [{ $ref: "#/components/schemas/BdtFeeAmount" }]
          description: Gross historical fee before discount, from enrollment override or batch monthly fee.
        discountAmount:
          allOf: [{ $ref: "#/components/schemas/BdtFeeAmount" }]
          description: Applied enrollment discount, capped at expectedAmount; snapshot preserved.
        paidAmount: { $ref: "#/components/schemas/BdtFeeAmount" }
        dueAmount:
          allOf: [{ $ref: "#/components/schemas/BdtFeeAmount" }]
          description: PostgreSQL generated amount max(expectedAmount - discountAmount - paidAmount, 0). Overpayments never create negative dues.
        status: { $ref: "#/components/schemas/StudentFeeStatus" }
        dueDate:
          type: string
          format: date
          description: Snapshot of workspace due day, clamped to month-end. Missing/null due day or missing settings defaults to month-end.
        graceDate:
          type: string
          format: date
          description: Snapshot of dueDate plus workspace grace days (zero if settings missing).
        createdAt: { type: string, format: date-time }
