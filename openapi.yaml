openapi: 3.0.3
info:
  title: EduFlow API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/activity:
    get:
      summary: List platform business activity
      operationId: listPlatformActivity
      description: Returns a paginated, privacy-safe summary of auditable payment, plan, entitlement, and lifecycle actions. Sensitive request payloads and credentials are never included.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [payment, plan, entitlement, lifecycle] } }
      responses:
        "200": { description: Paginated platform activity with safe metadata summaries }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/account/state:
    get:
      summary: Get the authenticated account's SaaS routing state
      operationId: getAccountState
      description: Database-derived routing state. A workspace membership takes precedence over an approved unused purchase; pending purchases route to payment review.
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Current account routing state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [route]
                    properties:
                      route: { type: string, enum: [dashboard, workspace_creation, payment_pending, account] }
                      workspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/workspaces/onboarding-state:
    get:
      summary: Get the current workspace onboarding state
      operationId: getWorkspaceOnboardingState
      description: Returns routing state derived from existing workspace, subscription-access, and payment-request records.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/WorkspaceOnboardingState" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/workspaces/onboard:
    post:
      summary: Create the workspace for an approved account purchase
      operationId: createWorkspaceOnboard
      description: Consumes the authenticated user's approved unused subscription purchase atomically, then creates the active workspace, Owner membership, default settings, and attached subscription. A user who already belongs to a workspace cannot create another one.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceOnboard" }
      responses:
        "201":
          description: Active workspace created from the approved purchase
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/OnboardedWorkspace" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Workspace already exists, slug already exists, or creation is not unlocked by an approved purchase }
  /api/v1/workspaces/dashboard-summary:
    get:
      summary: Get the current workspace dashboard summary
      operationId: getWorkspaceDashboardSummary
      description: Returns the authenticated member's own workspace identity, access state, current plan dates, effective feature entitlements, membership count, and latest subscription-payment status. The workspace is resolved only from the verified X-Workspace-Id membership context.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current workspace dashboard information
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/WorkspaceDashboardSummary" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
        "404": { description: Workspace not found }
  /api/v1/workspaces/{workspaceId}/subscription-operations/{operation}:
  /api/v1/teachers:
    get:
      summary: List workspace teachers
      operationId: listTeachers
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses: { "200": { description: Paginated teachers }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" } }
    post:
      summary: Create a workspace teacher
      operationId: createTeacher
      security: [{ betterAuth: [] }]
      responses: { "201": { description: Teacher created }, "400": { $ref: "#/components/responses/ValidationError" }, "409": { description: Teacher code already exists in this workspace } }
  /api/v1/teachers/{id}:
    get: { summary: Get workspace teacher, operationId: getTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher }, "404": { description: Teacher not found } } }
    patch: { summary: Update or reactivate workspace teacher, operationId: updateTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher updated }, "409": { description: Teacher code already exists in this workspace } } }
    delete: { summary: Archive workspace teacher, operationId: archiveTeacher, security: [{ betterAuth: [] }], responses: { "200": { description: Teacher archived } } }
  /api/v1/batches:
    get:
      summary: List workspace batches
      operationId: listBatches
      description: Returns a paginated, search-filtered list scoped to the verified workspace context. Requires active subscription access and batches.view permission.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, archived] } }
      responses:
        "200": { $ref: "#/components/responses/BatchList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BatchAccessRequired" }
    post:
      summary: Create a workspace batch profile
      operationId: createBatch
      description: Creates a batch with workspace-owned academic references. The optional start date is a calendar date. Teacher and student assignments are intentionally excluded.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBatch" } } } }
      responses:
        "201": { $ref: "#/components/responses/BatchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BatchAccessRequired" }
        "409": { description: A batch with this name already exists in this workspace }
  /api/v1/batches/{id}:
    get:
      summary: Get workspace batch detail
      operationId: getBatch
      description: Returns the batch profile and its academic labels, all scoped to the verified workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    patch:
      summary: Update or reactivate a workspace batch profile
      operationId: updateBatch
      description: Updates batch profile values. Teacher and student assignments are intentionally excluded.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace }, "409": { description: A batch with this name already exists in this workspace } }
    delete:
      summary: Archive a workspace batch
      operationId: archiveBatch
      description: Soft-archives the batch by setting its status to archived; no batch profile data is hard-deleted.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
  /api/v1/batches/{id}/teachers:
    get:
      summary: List teachers assigned to a batch
      operationId: listBatchTeachers
      description: Returns teachers assigned to the verified workspace batch, with the optional primary-teacher flag.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    post:
      summary: Assign a teacher to a batch
      operationId: assignBatchTeacher
      description: Assigns one workspace-owned teacher. A teacher can be assigned once per batch; setting isPrimary replaces any existing primary teacher.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssignBatchTeacher" } } } }
      responses: { "201": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch or teacher not found in this workspace }, "409": { description: Teacher is already assigned to this batch } }
  /api/v1/batches/{id}/teachers/{teacherId}:
    patch:
      summary: Set or clear a batch primary teacher
      operationId: updateBatchTeacher
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBatchTeacher" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch teacher assignment not found } }
    delete:
      summary: Remove a teacher from a batch
      operationId: removeBatchTeacher
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/BatchTeachersResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch teacher assignment not found } }
  /api/v1/batches/{id}/students:
    get:
      summary: List students enrolled in a batch
      operationId: listBatchStudents
      description: Returns students enrolled in the verified workspace batch with customized fee information and status.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch not found in this workspace } }
    post:
      summary: Enroll a student into a batch
      operationId: enrollBatchStudent
      description: Enrolls an active workspace student into the batch with optional fee overrides or discounts.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollStudent" } } } }
      responses: { "201": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Batch or student not found in this workspace }, "409": { description: Student is already actively enrolled in this batch } }
  /api/v1/batches/{id}/students/{enrollmentId}:
    patch:
      summary: Update or archive/reactivate student enrollment
      operationId: updateBatchEnrollment
      description: Updates student fee configuration, joined date, or status (active, inactive, archived).
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEnrollment" } } } }
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Student enrollment not found in this batch } }
    delete:
      summary: Archive a student's batch enrollment
      operationId: archiveBatchEnrollment
      description: Archives the enrollment without deleting it, preserving enrollment history.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/BatchId" }, { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/BatchEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/BatchAccessRequired" }, "404": { description: Student enrollment not found in this batch } }
  /api/v1/students:
    get:
      summary: List workspace students
      operationId: listStudents
      description: Returns a paginated, search-filtered list scoped to the verified workspace context. Requires active subscription access and students.view permission.
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, archived] } }
      responses:
        "200": { $ref: "#/components/responses/StudentList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StudentAccessRequired" }
    post:
      summary: Create a workspace student
      operationId: createStudent
      description: Creates a student in the verified workspace context. studentCode is unique only within that workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateStudent" } } } }
      responses:
        "201": { $ref: "#/components/responses/StudentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/StudentAccessRequired" }
        "409": { description: A student code already exists in this workspace }
  /api/v1/students/{id}:
    get:
      summary: Get a workspace student
      operationId: getStudent
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
  /api/v1/students/{id}/enrollments:
    get:
      summary: List a student's batch enrollment history
      operationId: listStudentEnrollments
      description: Returns current and historical batch memberships for a student in the verified workspace.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentEnrollmentsResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
    patch:
      summary: Update a workspace student
      operationId: updateStudent
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStudent" } } } }
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace }, "409": { description: A student code already exists in this workspace } }
    delete:
      summary: Archive a workspace student
      operationId: archiveStudent
      description: Soft-archives the student by setting status to archived; no student record is hard-deleted.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }, { $ref: "#/components/parameters/StudentId" }]
      responses: { "200": { $ref: "#/components/responses/StudentResponse" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthenticated" }, "403": { $ref: "#/components/responses/StudentAccessRequired" }, "404": { description: Student not found in this workspace } }
  /api/v1/workspaces/{workspaceId}/subscription-operations/{operation}:
    post:
      summary: Run a Platform Owner subscription lifecycle operation
      operationId: runPlatformSubscriptionOperation
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
        - {
            name: operation,
            in: path,
            required: true,
            schema: { type: string, enum: [lock, unlock, renewal-due, expire, schedule-deletion] }
          }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                properties: { scheduledDeleteAt: { type: string, format: date-time } }
              }
      responses:
        "200": { description: Lifecycle operation applied or already satisfied }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace or subscription not found }
        "409": { description: Invalid lifecycle transition }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides:
    get:
      summary: List workspace entitlement overrides
      operationId: listWorkspaceEntitlementOverrides
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      responses:
        {
          "200":
            {
              description: Overrides,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          properties:
                            { data: { type: array, items: { $ref: "#/components/schemas/EntitlementOverride" } } }
                        }
                    }
                }
            },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found }
        }
    post:
      summary: Create a workspace entitlement override
      operationId: createWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverrideInput" } } }
        }
      responses:
        {
          "201": { description: Override created },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found },
          "409": { description: Override already exists }
        }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides/{id}:
    patch:
      summary: Update a workspace entitlement override
      operationId: updateWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverridePatch" } } }
        }
      responses:
        {
          "200": { description: Override updated },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
    delete:
      summary: Remove a workspace entitlement override
      operationId: removeWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      responses:
        {
          "204": { description: Override removed },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
  /api/v1/plans:
    get:
      summary: List plans
      operationId: listPlans
      security: [{ betterAuth: [] }]
      responses:
        "200":
          {
            description: Plans,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } }
                      }
                  }
              }
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
    post:
      summary: Create a plan
      operationId: createPlan
      security: [{ betterAuth: [] }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "201": { description: Plan created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { description: Plan slug already exists }
  /api/v1/public/plans:
    get:
      summary: List active purchasable plans
      operationId: listPublicPlans
      description: Returns only active plans and their public feature defaults. Monetary and quota values are exact minor-unit strings.
      responses:
        "200":
          description: Active public plans
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicPlan" } }
  /api/v1/plans/{id}:
    patch:
      summary: Update a plan
      operationId: updatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "200": { description: Plan updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Plan not found }
        "409": { description: Plan slug already exists }
  /api/v1/plans/features:
    get:
      summary: List the Platform feature catalog for plan configuration
      operationId: listPlatformFeatures
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Feature catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/plans/{id}/activate:
    post:
      summary: Activate a plan
      operationId: activatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan activated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/plans/{id}/deactivate:
    post:
      summary: Deactivate a plan without deleting history
      operationId: deactivatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan deactivated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/workspaces/{id}:
    get:
      summary: Get a Platform Owner workspace detail
      operationId: getPlatformWorkspaceDetail
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
      responses:
        "200":
          {
            description: Workspace detail,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { $ref: "#/components/schemas/WorkspaceDetail" } }
                      }
                  }
              }
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace not found }
  /api/v1/workspaces:
    get:
      summary: List workspaces for the Platform Owner
      operationId: listPlatformWorkspaces
      security:
        - betterAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 150 } }
        - {
            name: workspaceStatus,
            in: query,
            schema: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
          }
        - {
            name: subscriptionStatus,
            in: query,
            schema: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
          }
        - {
            name: accessStatus,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    verification_pending,
                    payment_pending,
                    trial,
                    active,
                    renewal_due,
                    subscription_expired,
                    locked,
                    scheduled_for_deletion,
                    suspended
                  ]
              }
          }
        - {
            name: lifecycleQueue,
            in: query,
            description: Restrict the list to locked and scheduled-for-deletion workspaces for the Platform Owner deletion queue.
            schema: { type: boolean }
          }
      responses:
        "200":
          description: Paginated workspace listing with raw workspace, subscription, and effective access summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests:
    post:
      summary: Submit a manual subscription payment
      operationId: createPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Pending payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account:
    post:
      summary: Submit a manual subscription payment for the authenticated account
      operationId: createAccountPaymentRequest
      description: Creates an account-level pending purchase without creating a workspace. Platform Owner approval unlocks one workspace creation.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Pending account payment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account/latest:
    get:
      summary: Get the authenticated account's latest subscription payment
      operationId: getLatestAccountPaymentRequest
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Latest account-level payment request, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf: [{ $ref: "#/components/schemas/PaymentRequest" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/payment-requests/pending:
    get:
      summary: List pending payment requests
      operationId: listPendingPaymentRequests
      security:
        - betterAuth: []
      responses:
        "200":
          description: Pending payment requests
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PendingPaymentRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/revenue-overview:
    get:
      summary: Get Platform Owner payment and revenue aggregates
      operationId: getRevenueOverview
      description: Aggregates payment records in PostgreSQL and returns exact minor-unit amounts as decimal strings.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Exact payment aggregates, approved revenue by plan, and recent payment activity }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/latest:
    get:
      summary: Get the latest subscription payment for the selected workspace
      operationId: getLatestPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Latest subscription payment request, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaymentRequest"
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/payment-requests/{id}/approve:
    post:
      summary: Approve a pending payment request
      operationId: approvePaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      description: Account-level payments unlock one workspace creation. Workspace renewal payments transactionally create or renew the workspace subscription. Previous current subscriptions are retained as historical rows.
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
  /api/v1/payment-requests/{id}/reject:
    post:
      summary: Reject a pending payment request
      operationId: rejectPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              additionalProperties: false
              properties:
                rejectionReason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
components:
  securitySchemes:
    betterAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    WorkspacePathId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverrideId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspacePathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    PaymentRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CreateBatch:
      type: object
      additionalProperties: false
      required: [name, classLevelId]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        classLevelId: { type: string, format: uuid }
        mediumId: { type: string, format: uuid, nullable: true }
        academicGroupId: { type: string, format: uuid, nullable: true }
        startDate: { type: string, format: date, nullable: true, description: Batch calendar start date }
        monthlyFee: { oneOf: [{ type: number, minimum: 0 }, { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }], description: Monthly fee in BDT Taka (e.g. 2000 or "2000.50") }
        monthlyFeeMinor: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\d+$' }], description: Monthly fee in BDT poisha (e.g. 200000) }
        status: { type: string, enum: [active, inactive, archived] }
    UpdateBatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any non-empty subset of batch profile fields.
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        classLevelId: { type: string, format: uuid }
        mediumId: { type: string, format: uuid, nullable: true }
        academicGroupId: { type: string, format: uuid, nullable: true }
        startDate: { type: string, format: date, nullable: true, description: Batch calendar start date }
        monthlyFee: { oneOf: [{ type: number, minimum: 0 }, { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }], description: Monthly fee in BDT Taka (e.g. 2000 or "2000.50") }
        monthlyFeeMinor: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\d+$' }], description: Monthly fee in BDT poisha (e.g. 200000) }
        status: { type: string, enum: [active, inactive] }
    Batch:
      type: object
      required: [id, name, classLevelId, monthlyFeeMinor, status, createdAt, updatedAt, classLevel]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        classLevelId: { type: string, format: uuid }
        mediumId: { type: string, format: uuid, nullable: true }
        academicGroupId: { type: string, format: uuid, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        monthlyFee: { type: string, description: Monthly fee in BDT Taka }
        monthlyFeeMinor: { type: string, pattern: '^\d+$', description: Monthly fee in BDT poisha }
        status: { type: string, enum: [active, inactive, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        classLevel: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        medium: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        academicGroup: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
    AssignBatchTeacher:
      type: object
      additionalProperties: false
      required: [teacherId]
      properties:
        teacherId: { type: string, format: uuid }
        isPrimary: { type: boolean, default: false }
    UpdateBatchTeacher:
      type: object
      additionalProperties: false
      required: [isPrimary]
      properties:
        isPrimary: { type: boolean }
    BatchTeacher:
      type: object
      required: [id, teacherId, teacherCode, name, status, isPrimary, assignedAt]
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        teacherCode: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive, archived] }
        isPrimary: { type: boolean }
        assignedAt: { type: string, format: date-time }
    CreateStudent:
      type: object
      additionalProperties: false
      required: [studentCode, fullName]
      properties:
        studentCode: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, nullable: true, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        guardianName: { type: string, nullable: true, maxLength: 150 }
        guardianPhone: { type: string, nullable: true, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        address: { type: string, nullable: true, maxLength: 2000 }
        gender: { type: string, nullable: true, enum: [male, female, other] }
        admissionDate: { type: string, nullable: true, format: date }
        status: { type: string, enum: [active, inactive, archived] }
        notes: { type: string, nullable: true, maxLength: 5000 }
    UpdateStudent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        studentCode: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, nullable: true, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        guardianName: { type: string, nullable: true, maxLength: 150 }
        guardianPhone: { type: string, nullable: true, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        address: { type: string, nullable: true, maxLength: 2000 }
        gender: { type: string, nullable: true, enum: [male, female, other] }
        admissionDate: { type: string, nullable: true, format: date }
        status: { type: string, enum: [active, inactive, archived] }
        notes: { type: string, nullable: true, maxLength: 5000 }
    Student:
      allOf: [{ $ref: "#/components/schemas/CreateStudent" }]
      required: [id, studentCode, fullName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceOnboardingState:
      type: object
      required: [step, workspaceStatus, paymentPending, access]
      properties:
        step: { type: string, enum: [workspace_created, subscription_required, payment_pending, ready] }
        workspaceStatus: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
        paymentPending: { type: boolean }
        access:
          type: object
          required: [allowed, status, reason]
          properties:
            allowed: { type: boolean }
            status:
              {
                type: string,
                enum:
                  [verification_pending, payment_pending, trial, active, renewal_due, subscription_expired, locked, scheduled_for_deletion, suspended]
              }
            reason: { type: string }
    CreateWorkspaceOnboard:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        phone: { type: string, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        email: { type: string, format: email, maxLength: 255 }
        address: { type: string, minLength: 1, maxLength: 2000 }
    OnboardedWorkspace:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        status: { type: string, enum: [pending] }
        createdAt: { type: string, format: date-time }
    EntitlementOverrideInput:
      type: object
      required: [featureKey, enabledOverride, limitOverride, reason, expiresAt]
      additionalProperties: false
      properties:
        featureKey: { type: string, minLength: 1, maxLength: 100 }
        enabledOverride: { type: boolean, nullable: true }
        limitOverride: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }], nullable: true }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time, nullable: true }
    EntitlementOverridePatch:
      allOf: [{ $ref: "#/components/schemas/EntitlementOverrideInput" }]
      description: Any subset of override fields.
    EntitlementOverride:
      allOf: [{ $ref: "#/components/schemas/EntitlementOverrideInput" }]
      properties:
        {
          id: { type: string, format: uuid },
          workspaceId: { type: string, format: uuid },
          limitOverride: { type: string, nullable: true },
          createdAt: { type: string, format: date-time },
          updatedAt: { type: string, format: date-time }
        }
    PlanInput:
      type: object
      additionalProperties: false
      required: [name, slug, priceMinor, durationDays, trialDays]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        priceMinor: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }] }
        durationDays: { type: integer, minimum: 0 }
        trialDays: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        features:
          {
            type: array,
            items:
              {
                type: object,
                required: [featureKey, enabled, limitValue],
                properties:
                  {
                    featureKey: { type: string },
                    enabled: { type: boolean },
                    limitValue:
                      { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }], nullable: true }
                  },
                additionalProperties: false
              }
          }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanInput"
        - type: object
          properties:
            {
              id: { type: string, format: uuid },
              priceMinor: { type: string },
              createdAt: { type: string, format: date-time },
              updatedAt: { type: string, format: date-time }
            }
    FeatureCatalogItem:
      type: object
      required: [key, name, description]
      properties:
        key: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
    PublicPlan:
      type: object
      required: [id, name, slug, priceMinor, durationDays, trial, features, quotas]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        priceMinor: { type: string, pattern: '^\d+$', description: BDT poisha }
        durationDays: { type: integer, minimum: 0 }
        trial:
          type: object
          required: [included, days]
          properties:
            included: { type: boolean }
            days: { type: integer, minimum: 0 }
        features:
          type: array
          items:
            type: object
            required: [key, name, description, defaultLimit]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              defaultLimit: { type: string, nullable: true, pattern: '^\d+$' }
        quotas:
          type: object
          additionalProperties: { type: string, nullable: true, pattern: '^\d+$' }
    WorkspaceDetail:
      type: object
      required: [workspace, subscription, access, subscriptionHistory, recentPayments, activeEntitlementOverrides]
      properties:
        workspace:
          type: object
          required: [id, name, slug, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            slug: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            address: { type: string, nullable: true }
            status: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            activatedAt: { type: string, format: date-time, nullable: true }
            lockedAt: { type: string, format: date-time, nullable: true }
            scheduledDeleteAt: { type: string, format: date-time, nullable: true }
        subscription: { nullable: true, type: object }
        access:
          {
            type: object,
            required: [allowed, status, reason],
            properties: { allowed: { type: boolean }, status: { type: string }, reason: { type: string } }
          }
        subscriptionHistory: { type: array, items: { type: object } }
        recentPayments: { type: array, items: { $ref: "#/components/schemas/PaymentRequest" } }
        activeEntitlementOverrides: { type: array, items: { type: object } }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    WorkspaceSummary:
      type: object
      required: [id, name, slug, workspaceStatus, createdAt, subscription, access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        slug: { type: string, nullable: true }
        workspaceStatus: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: string, format: date-time, nullable: true }
        scheduledDeleteAt: { type: string, format: date-time, nullable: true }
        subscription:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
            startsAt: { type: string, format: date-time, nullable: true }
            expiresAt: { type: string, format: date-time, nullable: true }
            trialEndsAt: { type: string, format: date-time, nullable: true }
            plan:
              {
                type: object,
                nullable: true,
                properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { type: string } }
              }
        access:
          type: object
          required: [allowed, status, reason]
          properties:
            allowed: { type: boolean }
            status: { type: string }
            reason: { type: string }
    WorkspaceDashboardSummary:
      type: object
      required: [workspace, access, subscription, memberCount, entitlements, latestPayment]
      properties:
        workspace:
          type: object
          required: [id, name, status]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            status: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
        access:
          type: object
          required: [allowed, status, reason]
          properties:
            allowed: { type: boolean }
            status: { type: string, enum: [verification_pending, payment_pending, trial, active, renewal_due, subscription_expired, locked, scheduled_for_deletion, suspended] }
            reason: { type: string }
        subscription:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SubscriptionDashboardStatus" }]
        memberCount: { type: integer, minimum: 0 }
        entitlements:
          type: array
          items:
            type: object
            required: [key, enabled, limit]
            properties:
              key: { type: string }
              enabled: { type: boolean }
              limit: { type: string, nullable: true, description: Integer limit serialized as a string. }
        latestPayment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PaymentDashboardStatus" }]
    SubscriptionDashboardStatus:
      type: object
      required: [status, planName, startsAt, expiresAt, trialEndsAt, renewalDueAt]
      properties:
        status: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
        planName: { type: string, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        renewalDueAt: { type: string, format: date-time, nullable: true }
    PaymentDashboardStatus:
      type: object
      required: [status, createdAt, reviewedAt]
      properties:
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [planId, amount, paymentMethod, senderNumber, transactionId]
      properties:
        planId: { type: string, format: uuid }
        amount: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }] }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string, minLength: 1, maxLength: 30 }
        transactionId: { type: string, minLength: 1, maxLength: 100 }
    PaymentRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid, nullable: true }
        amountMinor: { type: string, pattern: '^\\d+$' }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string }
        transactionId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedByUserId: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PendingPaymentRequest:
      type: object
      required: [id, purpose, amountMinor, paymentMethod, senderNumber, transactionId, status, createdAt, workspace, plan]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [subscription, sms_credit] }
        amountMinor: { type: string, pattern: '^\\d+$' }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string }
        transactionId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            slug: { type: string, nullable: true }
        plan:
          type: object
          nullable: true
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
    PaymentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PaymentRequest" }
    EnrollStudent:
      type: object
      required: [studentId]
      properties:
        studentId: { type: string, format: uuid }
        joinedAt: { type: string, format: date, nullable: true }
        feeOverrideMinor: { type: string, pattern: '^\\d+$', nullable: true }
        discountMinor: { type: string, pattern: '^\\d+$', nullable: true }
    UpdateEnrollment:
      type: object
      properties:
        joinedAt: { type: string, format: date, nullable: true }
        feeOverrideMinor: { type: string, pattern: '^\\d+$', nullable: true }
        discountMinor: { type: string, pattern: '^\\d+$', nullable: true }
        status: { type: string, enum: [active, inactive, completed, cancelled, archived] }
    BatchEnrollment:
      type: object
      required: [id, studentId, studentCode, name, joinedAt, feeOverrideMinor, discountMinor, status]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentCode: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        joinedAt: { type: string, format: date, nullable: true }
        feeOverrideMinor: { type: string, pattern: '^\\d+$', nullable: true }
        discountMinor: { type: string, pattern: '^\\d+$', nullable: true }
        status: { type: string, enum: [active, inactive, completed, cancelled, archived] }
    StudentEnrollment:
      type: object
      required: [id, batchId, batchName, joinedAt, feeOverrideMinor, discountMinor, status]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchName: { type: string }
        joinedAt: { type: string, format: date }
        feeOverrideMinor: { type: string, pattern: '^\\d+$', nullable: true }
        discountMinor: { type: string, pattern: '^\\d+$', nullable: true }
        status: { type: string, enum: [active, inactive, completed, cancelled, archived] }
  responses:
    BatchEnrollmentResponse:
      description: Student enrollment detail
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/BatchEnrollment" } } } } }
    BatchEnrollmentsResponse:
      description: Students enrolled in a batch
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/BatchEnrollment" } } } } } }
    StudentEnrollmentsResponse:
      description: Current and historical batch memberships for a student
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/StudentEnrollment" } } } } } }
    BatchResponse:
      description: Batch profile with academic labels
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Batch" } } } } }
    BatchTeachersResponse:
      description: Teachers assigned to a batch
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/BatchTeacher" } } } } } }
    BatchList:
      description: Paginated workspace batches
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: "#/components/schemas/Batch" } }, meta: { $ref: "#/components/schemas/PaginationMeta" } } } }
    BatchAccessRequired:
      description: Workspace membership, active subscription, or required batch permission is missing
    StudentResponse:
      description: Student record
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } } } }
    StudentList:
      description: Paginated workspace students
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: "#/components/schemas/Student" } }, meta: { $ref: "#/components/schemas/PaginationMeta" } } } }
    StudentAccessRequired:
      description: Workspace membership, active subscription, or required student permission is missing
    ReviewedPayment:
      description: Payment request reviewed
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentResponse" } } }
    ValidationError:
      description: Invalid request
    Unauthenticated:
      description: Authentication required
    WorkspaceMembershipRequired:
      description: Workspace membership required
    PlatformOwnerRequired:
      description: Platform Owner authorization required
    DuplicateTransaction:
      description: Transaction ID already exists
    AlreadyReviewed:
      description: Payment request has already been reviewed
