openapi: 3.0.3
info:
  title: EduFlow API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/activity:
    get:
      summary: List platform business activity
      operationId: listPlatformActivity
      description: Returns a paginated, privacy-safe summary of auditable payment, plan, entitlement, and lifecycle actions. Sensitive request payloads and credentials are never included.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [payment, plan, entitlement, lifecycle] } }
      responses:
        "200": { description: Paginated platform activity with safe metadata summaries }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/account/state:
    get:
      summary: Get the authenticated account's SaaS routing state
      operationId: getAccountState
      description: Database-derived routing state. A workspace membership takes precedence over an approved unused purchase; pending purchases route to payment review.
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Current account routing state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [route]
                    properties:
                      route: { type: string, enum: [dashboard, workspace_creation, payment_pending, account] }
                      workspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/workspaces/onboarding-state:
    get:
      summary: Get the current workspace onboarding state
      operationId: getWorkspaceOnboardingState
      description: Returns routing state derived from existing workspace, subscription-access, and payment-request records.
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/WorkspaceOnboardingState" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/workspaces/onboard:
    post:
      summary: Create the workspace for an approved account purchase
      operationId: createWorkspaceOnboard
      description: Consumes the authenticated user's approved unused subscription purchase atomically, then creates the active workspace, Owner membership, default settings, and attached subscription. A user who already belongs to a workspace cannot create another one.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceOnboard" }
      responses:
        "201":
          description: Active workspace created from the approved purchase
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/OnboardedWorkspace" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Workspace already exists, slug already exists, or creation is not unlocked by an approved purchase }
  /api/v1/workspaces/{workspaceId}/subscription-operations/{operation}:
    post:
      summary: Run a Platform Owner subscription lifecycle operation
      operationId: runPlatformSubscriptionOperation
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
        - {
            name: operation,
            in: path,
            required: true,
            schema: { type: string, enum: [lock, unlock, renewal-due, expire, schedule-deletion] }
          }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                properties: { scheduledDeleteAt: { type: string, format: date-time } }
              }
      responses:
        "200": { description: Lifecycle operation applied or already satisfied }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace or subscription not found }
        "409": { description: Invalid lifecycle transition }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides:
    get:
      summary: List workspace entitlement overrides
      operationId: listWorkspaceEntitlementOverrides
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      responses:
        {
          "200":
            {
              description: Overrides,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          properties:
                            { data: { type: array, items: { $ref: "#/components/schemas/EntitlementOverride" } } }
                        }
                    }
                }
            },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found }
        }
    post:
      summary: Create a workspace entitlement override
      operationId: createWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverrideInput" } } }
        }
      responses:
        {
          "201": { description: Override created },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Workspace not found },
          "409": { description: Override already exists }
        }
  /api/v1/workspaces/{workspaceId}/entitlement-overrides/{id}:
    patch:
      summary: Update a workspace entitlement override
      operationId: updateWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementOverridePatch" } } }
        }
      responses:
        {
          "200": { description: Override updated },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
    delete:
      summary: Remove a workspace entitlement override
      operationId: removeWorkspaceEntitlementOverride
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspacePathId" }, { $ref: "#/components/parameters/OverrideId" }]
      responses:
        {
          "204": { description: Override removed },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Override not found }
        }
  /api/v1/plans:
    get:
      summary: List plans
      operationId: listPlans
      security: [{ betterAuth: [] }]
      responses:
        "200":
          {
            description: Plans,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } }
                      }
                  }
              }
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
    post:
      summary: Create a plan
      operationId: createPlan
      security: [{ betterAuth: [] }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "201": { description: Plan created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { description: Plan slug already exists }
  /api/v1/public/plans:
    get:
      summary: List active purchasable plans
      operationId: listPublicPlans
      description: Returns only active plans and their public feature defaults. Monetary and quota values are exact minor-unit strings.
      responses:
        "200":
          description: Active public plans
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicPlan" } }
  /api/v1/plans/{id}:
    patch:
      summary: Update a plan
      operationId: updatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses:
        "200": { description: Plan updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Plan not found }
        "409": { description: Plan slug already exists }
  /api/v1/plans/features:
    get:
      summary: List the Platform feature catalog for plan configuration
      operationId: listPlatformFeatures
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Feature catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/plans/{id}/activate:
    post:
      summary: Activate a plan
      operationId: activatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan activated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/plans/{id}/deactivate:
    post:
      summary: Deactivate a plan without deleting history
      operationId: deactivatePlan
      security: [{ betterAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        {
          "200": { description: Plan deactivated },
          "401": { $ref: "#/components/responses/Unauthenticated" },
          "403": { $ref: "#/components/responses/PlatformOwnerRequired" },
          "404": { description: Plan not found }
        }
  /api/v1/workspaces/{id}:
    get:
      summary: Get a Platform Owner workspace detail
      operationId: getPlatformWorkspaceDetail
      security: [{ betterAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspacePathId" }
      responses:
        "200":
          {
            description: Workspace detail,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties: { data: { $ref: "#/components/schemas/WorkspaceDetail" } }
                      }
                  }
              }
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "404": { description: Workspace not found }
  /api/v1/workspaces:
    get:
      summary: List workspaces for the Platform Owner
      operationId: listPlatformWorkspaces
      security:
        - betterAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 150 } }
        - {
            name: workspaceStatus,
            in: query,
            schema: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
          }
        - {
            name: subscriptionStatus,
            in: query,
            schema: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
          }
        - {
            name: accessStatus,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    verification_pending,
                    payment_pending,
                    trial,
                    active,
                    renewal_due,
                    subscription_expired,
                    locked,
                    scheduled_for_deletion,
                    suspended
                  ]
              }
          }
        - {
            name: lifecycleQueue,
            in: query,
            description: Restrict the list to locked and scheduled-for-deletion workspaces for the Platform Owner deletion queue.
            schema: { type: boolean }
          }
      responses:
        "200":
          description: Paginated workspace listing with raw workspace, subscription, and effective access summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests:
    post:
      summary: Submit a manual subscription payment
      operationId: createPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Pending payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account:
    post:
      summary: Submit a manual subscription payment for the authenticated account
      operationId: createAccountPaymentRequest
      description: Creates an account-level pending purchase without creating a workspace. Platform Owner approval unlocks one workspace creation.
      security: [{ betterAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Pending account payment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { description: Validation error, unavailable plan, or amount mismatch }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/DuplicateTransaction" }
  /api/v1/payment-requests/account/latest:
    get:
      summary: Get the authenticated account's latest subscription payment
      operationId: getLatestAccountPaymentRequest
      security: [{ betterAuth: [] }]
      responses:
        "200":
          description: Latest account-level payment request, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf: [{ $ref: "#/components/schemas/PaymentRequest" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/payment-requests/pending:
    get:
      summary: List pending payment requests
      operationId: listPendingPaymentRequests
      security:
        - betterAuth: []
      responses:
        "200":
          description: Pending payment requests
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PendingPaymentRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/revenue-overview:
    get:
      summary: Get Platform Owner payment and revenue aggregates
      operationId: getRevenueOverview
      description: Aggregates payment records in PostgreSQL and returns exact minor-unit amounts as decimal strings.
      security: [{ betterAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Exact payment aggregates, approved revenue by plan, and recent payment activity }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
  /api/v1/payment-requests/latest:
    get:
      summary: Get the latest subscription payment for the selected workspace
      operationId: getLatestPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Latest subscription payment request, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaymentRequest"
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceMembershipRequired" }
  /api/v1/payment-requests/{id}/approve:
    post:
      summary: Approve a pending payment request
      operationId: approvePaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      description: Account-level payments unlock one workspace creation. Workspace renewal payments transactionally create or renew the workspace subscription. Previous current subscriptions are retained as historical rows.
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
  /api/v1/payment-requests/{id}/reject:
    post:
      summary: Reject a pending payment request
      operationId: rejectPaymentRequest
      security:
        - betterAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              additionalProperties: false
              properties:
                rejectionReason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/ReviewedPayment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlatformOwnerRequired" }
        "409": { $ref: "#/components/responses/AlreadyReviewed" }
components:
  securitySchemes:
    betterAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    WorkspacePathId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverrideId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspacePathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    PaymentRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    WorkspaceOnboardingState:
      type: object
      required: [step, workspaceStatus, paymentPending, access]
      properties:
        step: { type: string, enum: [workspace_created, subscription_required, payment_pending, ready] }
        workspaceStatus: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
        paymentPending: { type: boolean }
        access:
          type: object
          required: [allowed, status, reason]
          properties:
            allowed: { type: boolean }
            status:
              {
                type: string,
                enum:
                  [verification_pending, payment_pending, trial, active, renewal_due, subscription_expired, locked, scheduled_for_deletion, suspended]
              }
            reason: { type: string }
    CreateWorkspaceOnboard:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        phone: { type: string, pattern: "^(?:\\+8801\\d{9}|01\\d{9})$" }
        email: { type: string, format: email, maxLength: 255 }
        address: { type: string, minLength: 1, maxLength: 2000 }
    OnboardedWorkspace:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        status: { type: string, enum: [pending] }
        createdAt: { type: string, format: date-time }
    EntitlementOverrideInput:
      type: object
      required: [featureKey, enabledOverride, limitOverride, reason, expiresAt]
      additionalProperties: false
      properties:
        featureKey: { type: string, minLength: 1, maxLength: 100 }
        enabledOverride: { type: boolean, nullable: true }
        limitOverride: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }], nullable: true }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time, nullable: true }
    EntitlementOverridePatch:
      allOf: [{ $ref: "#/components/schemas/EntitlementOverrideInput" }]
      description: Any subset of override fields.
    EntitlementOverride:
      allOf: [{ $ref: "#/components/schemas/EntitlementOverrideInput" }]
      properties:
        {
          id: { type: string, format: uuid },
          workspaceId: { type: string, format: uuid },
          limitOverride: { type: string, nullable: true },
          createdAt: { type: string, format: date-time },
          updatedAt: { type: string, format: date-time }
        }
    PlanInput:
      type: object
      additionalProperties: false
      required: [name, slug, priceMinor, durationDays, trialDays]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        priceMinor: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }] }
        durationDays: { type: integer, minimum: 0 }
        trialDays: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        features:
          {
            type: array,
            items:
              {
                type: object,
                required: [featureKey, enabled, limitValue],
                properties:
                  {
                    featureKey: { type: string },
                    enabled: { type: boolean },
                    limitValue:
                      { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }], nullable: true }
                  },
                additionalProperties: false
              }
          }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanInput"
        - type: object
          properties:
            {
              id: { type: string, format: uuid },
              priceMinor: { type: string },
              createdAt: { type: string, format: date-time },
              updatedAt: { type: string, format: date-time }
            }
    FeatureCatalogItem:
      type: object
      required: [key, name, description]
      properties:
        key: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
    PublicPlan:
      type: object
      required: [id, name, slug, priceMinor, durationDays, trial, features, quotas]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        priceMinor: { type: string, pattern: '^\d+$', description: BDT poisha }
        durationDays: { type: integer, minimum: 0 }
        trial:
          type: object
          required: [included, days]
          properties:
            included: { type: boolean }
            days: { type: integer, minimum: 0 }
        features:
          type: array
          items:
            type: object
            required: [key, name, description, defaultLimit]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              defaultLimit: { type: string, nullable: true, pattern: '^\d+$' }
        quotas:
          type: object
          additionalProperties: { type: string, nullable: true, pattern: '^\d+$' }
    WorkspaceDetail:
      type: object
      required: [workspace, subscription, access, subscriptionHistory, recentPayments, activeEntitlementOverrides]
      properties:
        workspace:
          type: object
          required: [id, name, slug, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            slug: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            address: { type: string, nullable: true }
            status: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            activatedAt: { type: string, format: date-time, nullable: true }
            lockedAt: { type: string, format: date-time, nullable: true }
            scheduledDeleteAt: { type: string, format: date-time, nullable: true }
        subscription: { nullable: true, type: object }
        access:
          {
            type: object,
            required: [allowed, status, reason],
            properties: { allowed: { type: boolean }, status: { type: string }, reason: { type: string } }
          }
        subscriptionHistory: { type: array, items: { type: object } }
        recentPayments: { type: array, items: { $ref: "#/components/schemas/PaymentRequest" } }
        activeEntitlementOverrides: { type: array, items: { type: object } }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    WorkspaceSummary:
      type: object
      required: [id, name, slug, workspaceStatus, createdAt, subscription, access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        slug: { type: string, nullable: true }
        workspaceStatus: { type: string, enum: [pending, active, locked, suspended, scheduled_deletion, deleted] }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: string, format: date-time, nullable: true }
        scheduledDeleteAt: { type: string, format: date-time, nullable: true }
        subscription:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [trial, pending, active, renewal_due, expired, cancelled, suspended] }
            startsAt: { type: string, format: date-time, nullable: true }
            expiresAt: { type: string, format: date-time, nullable: true }
            trialEndsAt: { type: string, format: date-time, nullable: true }
            plan:
              {
                type: object,
                nullable: true,
                properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { type: string } }
              }
        access:
          type: object
          required: [allowed, status, reason]
          properties:
            allowed: { type: boolean }
            status: { type: string }
            reason: { type: string }
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [planId, amount, paymentMethod, senderNumber, transactionId]
      properties:
        planId: { type: string, format: uuid }
        amount: { oneOf: [{ type: integer, minimum: 0 }, { type: string, pattern: '^\\d+$' }] }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string, minLength: 1, maxLength: 30 }
        transactionId: { type: string, minLength: 1, maxLength: 100 }
    PaymentRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid, nullable: true }
        amountMinor: { type: string, pattern: '^\\d+$' }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string }
        transactionId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedByUserId: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PendingPaymentRequest:
      type: object
      required: [id, purpose, amountMinor, paymentMethod, senderNumber, transactionId, status, createdAt, workspace, plan]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [subscription, sms_credit] }
        amountMinor: { type: string, pattern: '^\\d+$' }
        paymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, other] }
        senderNumber: { type: string }
        transactionId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            slug: { type: string, nullable: true }
        plan:
          type: object
          nullable: true
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
    PaymentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PaymentRequest" }
  responses:
    ReviewedPayment:
      description: Payment request reviewed
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentResponse" } } }
    ValidationError:
      description: Invalid request
    Unauthenticated:
      description: Authentication required
    WorkspaceMembershipRequired:
      description: Workspace membership required
    PlatformOwnerRequired:
      description: Platform Owner authorization required
    DuplicateTransaction:
      description: Transaction ID already exists
    AlreadyReviewed:
      description: Payment request has already been reviewed
